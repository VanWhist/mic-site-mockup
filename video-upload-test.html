<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>動画送信テスト | MIC</title>
<!--
  動画送信の試作（PoC）。iPhone Safari から Google Drive へ resumable upload で直接送れるかを確かめる。
  指示書：D:\Claude\MICホームページ\ClaudeCodeへの指示_動画送信の試作_20260926.md
  Apps Script：mic-ops/apps-script/MIC-Video-PoC

  ★ 試作が終わったら、このファイルは別の PR で消す。どこからもリンクしない。sitemap.xml に入れない。
  ★ 計測（mic-analytics.js・Cloudflare）は読み込まない。テストのアクセスを本番の数字に混ぜないため。
  ★ テスト用トークンは URL の #t=… で受け取り、すぐ sessionStorage に移して URL から消す。
    session URI は画面に末尾6文字しか出さず、「結果をコピー」にも含めない。
-->
<style>
  :root{--bg:#0a0a0c;--fg:#f5f5f7;--muted:#9a9a9f;--accent:#ff5a3c;--ok:#34c759;--ng:#ff453a;--card:#16161a;--line:rgba(255,255,255,.1);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    font-size:15px;line-height:1.6;padding:20px 16px 60px;max-width:640px;margin:0 auto;}
  h1{font-size:20px;margin-bottom:4px;}
  .sub{color:var(--muted);font-size:12.5px;margin-bottom:18px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;}
  .card h2{font-size:14px;color:var(--accent);margin-bottom:8px;letter-spacing:.04em;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0;}
  label{font-size:14px;}
  select,input[type=file]{font-size:15px;color:var(--fg);max-width:100%;}
  select{background:#222;border:1px solid var(--line);border-radius:8px;padding:6px 8px;}
  button{font-size:15px;font-weight:700;border:0;border-radius:999px;padding:11px 18px;background:var(--accent);color:#fff;}
  button.sec{background:#2a2a30;}
  button:disabled{opacity:.35;}
  .kv{display:grid;grid-template-columns:7.5em 1fr;gap:2px 8px;font-size:13.5px;}
  .kv dt{color:var(--muted);}
  .kv dd{word-break:break-all;}
  .bar{height:12px;background:#2a2a30;border-radius:999px;overflow:hidden;margin:10px 0 6px;}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s;}
  #status{font-weight:700;}
  .ok{color:var(--ok);} .ng{color:var(--ng);}
  #log{font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all;max-height:320px;overflow:auto;
    background:#000;border-radius:10px;padding:10px;color:#cfcfd4;}
  .note{font-size:12.5px;color:var(--muted);}
  .warn{color:#ffd60a;font-size:13px;}
</style>
</head>
<body>

<h1>動画送信テスト</h1>
<div class="sub">試作用のページです。選手・保護者には案内しません。</div>

<div class="card" id="tokenCard">
  <div id="tokenState" class="note"></div>
</div>

<div class="card">
  <h2>1. 動画を選ぶ</h2>
  <input type="file" id="picker" accept="video/*">
  <div id="resumeHint" class="warn" style="display:none;margin-top:8px;"></div>
  <dl class="kv" id="info" style="margin-top:10px;"></dl>
  <video id="probe" muted playsinline style="display:none"></video>
</div>

<div class="card">
  <h2>2. 設定</h2>
  <div class="row">
    <label for="chunk">区切りの大きさ</label>
    <select id="chunk">
      <option value="1">1 MiB</option>
      <option value="8" selected>8 MiB</option>
      <option value="16">16 MiB</option>
    </select>
  </div>
  <div class="row"><label><input type="checkbox" id="withOrigin"> 開始時に Origin を付ける（比較用）</label></div>
  <div class="row"><label><input type="checkbox" id="autoResume" checked> 通信が切れたら自動で再開する（最大20回）</label></div>
</div>

<div class="card">
  <h2>3. 送る</h2>
  <div class="row">
    <button id="btnStart" disabled>送信を開始</button>
    <button id="btnAbort" class="sec" disabled>中断</button>
    <button id="btnResume" class="sec" disabled>続きから</button>
  </div>
  <div class="bar"><i id="barFill"></i></div>
  <div id="status">動画を選んでください</div>
  <div class="note" id="stats"></div>
</div>

<div class="card">
  <h2>4. 結果</h2>
  <dl class="kv" id="checks"></dl>
  <div class="row" style="margin-top:10px;">
    <button id="btnCopy" class="sec">結果をコピー</button>
    <button id="btnClear" class="sec">記録を消す</button>
  </div>
  <div id="log" style="margin-top:10px;"></div>
</div>

<script>
(function(){
  'use strict';
  // MIC-Video-PoC のウェブアプリ URL（/exec）。デプロイ後に入れる。秘密の値ではない（upload.html も API の URL を持っている）
  var API_URL = 'https://script.google.com/macros/s/AKfycbyPWQQkb5hdJr1YKiWq02BHkiYaL5dcnRVfaeW1TPRXvQTBRzZy_KqmVRYY14ft1hB0DA/exec';
  var MAX_BYTES = 250 * 1024 * 1024;
  var MAX_AUTO_RESUME = 20;
  var SS_TOKEN = 'micVideoPoc.t', SS_SESSION = 'micVideoPoc.session';

  var $ = function(id){ return document.getElementById(id); };
  var el = {picker:$('picker'), info:$('info'), probe:$('probe'), chunk:$('chunk'), withOrigin:$('withOrigin'),
    autoResume:$('autoResume'), btnStart:$('btnStart'), btnAbort:$('btnAbort'), btnResume:$('btnResume'),
    barFill:$('barFill'), status:$('status'), stats:$('stats'), checks:$('checks'), log:$('log'),
    btnCopy:$('btnCopy'), btnClear:$('btnClear'), tokenState:$('tokenState'), resumeHint:$('resumeHint')};

  // ---------------------------------------------------------- 記録
  var t0 = Date.now();
  var lines = [];
  var checks = {session:null, preflightPut:null, got308:null, rangeReadable:null, completed:null, verified:null, resumedAfterCut:null};
  var CHECK_LABEL = {session:'session URI の取得', preflightPut:'ブラウザからの PUT', got308:'308 を受け取れた',
    rangeReadable:'Range を読めた', completed:'最後まで届いた', verified:'Drive 側で確認', resumedAfterCut:'切断後に再開できた'};

  function log(msg){
    var s = ((Date.now() - t0) / 1000).toFixed(1).padStart(7) + 's  ' + msg;
    lines.push(s);
    el.log.textContent = lines.slice(-200).join('\n');
    el.log.scrollTop = el.log.scrollHeight;
  }
  function setCheck(k, v){
    if (checks[k] === true && v === false) return; // 一度でも成功したら成功のまま
    checks[k] = v; renderChecks();
  }
  function renderChecks(){
    el.checks.innerHTML = '';
    Object.keys(CHECK_LABEL).forEach(function(k){
      var dt = document.createElement('dt'); dt.textContent = CHECK_LABEL[k];
      var dd = document.createElement('dd');
      var v = checks[k];
      dd.textContent = v === null ? '—' : (v ? '○' : '×');
      dd.className = v === null ? '' : (v ? 'ok' : 'ng');
      el.checks.appendChild(dt); el.checks.appendChild(dd);
    });
  }
  function status(text, cls){ el.status.textContent = text; el.status.className = cls || ''; }
  function tail(s){ return s ? '…' + String(s).slice(-6) : '-'; }
  function mb(n){ return (n / 1024 / 1024).toFixed(1) + 'MB'; }

  // 画面の状態の変化も記録する（バックグラウンドや画面ロックでどうなるかを見るため）
  document.addEventListener('visibilitychange', function(){ log('画面: ' + document.visibilityState); });
  window.addEventListener('pagehide', function(){ log('pagehide'); });
  window.addEventListener('online', function(){ log('通信: online'); });
  window.addEventListener('offline', function(){ log('通信: offline'); });

  // ---------------------------------------------------------- トークン
  function readToken(){
    var m = /(?:^|[#&])t=([A-Za-z0-9]+)/.exec(location.hash || '');
    if (m) {
      try { sessionStorage.setItem(SS_TOKEN, m[1]); } catch(e) {}
      history.replaceState(null, '', location.pathname); // URL からトークンを消す
      return m[1];
    }
    try { return sessionStorage.getItem(SS_TOKEN) || ''; } catch(e) { return ''; }
  }
  var token = readToken();
  el.tokenState.textContent = token ? 'テスト用トークン：受け取り済み（URL からは消しました）'
                                    : 'テスト用トークンがありません。テスト用URL.txt のリンクから開き直してください。';
  el.tokenState.className = token ? 'note ok' : 'note ng';

  function callApi(payload){
    payload.t = token;
    return fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload)})
      .then(function(res){ if (!res.ok) throw new Error('API ' + res.status); return res.json(); });
  }

  // ---------------------------------------------------------- 動画を選ぶ
  var file = null;
  var saved = null; // 読み込み直す前のセッション
  try { saved = JSON.parse(sessionStorage.getItem(SS_SESSION) || 'null'); } catch(e) {}
  if (saved) {
    el.resumeHint.style.display = '';
    el.resumeHint.textContent = '前回の送信が途中です（' + saved.name + '・' + mb(saved.size) + '）。同じ動画を選び直すと「続きから」を押せます。';
  }

  el.picker.addEventListener('change', function(){
    file = el.picker.files && el.picker.files[0];
    el.info.innerHTML = '';
    if (!file) return;
    addInfo('名前', file.name);
    addInfo('サイズ', mb(file.size) + '（' + file.size + ' バイト）');
    addInfo('種類', file.type || '（空）');
    addInfo('更新日時', new Date(file.lastModified).toLocaleString('ja-JP'));
    log('選択: ' + file.name + ' ' + mb(file.size) + ' ' + (file.type || '(type空)'));
    // 長さと縦横。再エンコードはしない。読めなくても送信には影響しない
    var url = URL.createObjectURL(file);
    el.probe.onloadedmetadata = function(){
      addInfo('長さ', el.probe.duration.toFixed(1) + ' 秒');
      addInfo('縦横', el.probe.videoWidth + ' × ' + el.probe.videoHeight);
      log('動画: ' + el.probe.duration.toFixed(1) + 's ' + el.probe.videoWidth + 'x' + el.probe.videoHeight);
      URL.revokeObjectURL(url);
    };
    el.probe.onerror = function(){ addInfo('長さ・縦横', '読み取れず'); URL.revokeObjectURL(url); };
    el.probe.src = url;

    var tooBig = file.size > MAX_BYTES;
    if (tooBig) status('250MB を超えています（サーバー側でも断られることを確かめるため、送信は押せます）', 'ng');
    else status('送信できます');
    el.btnStart.disabled = !token;
    el.btnResume.disabled = !(saved && sameFile(saved, file));
    if (saved && !sameFile(saved, file)) log('前回の動画と一致しない（名前・サイズ・更新日時）');
  });
  function addInfo(k, v){
    var dt = document.createElement('dt'); dt.textContent = k;
    var dd = document.createElement('dd'); dd.textContent = v;
    el.info.appendChild(dt); el.info.appendChild(dd);
  }
  function sameFile(s, f){ return s.name === f.name && s.size === f.size && s.lastModified === f.lastModified; }

  // ---------------------------------------------------------- 送る
  var session = '', total = 0, offset = 0, busy = false, aborter = null, autoCount = 0, hadCut = false, startedAt = 0;

  function chunkBytes(){ return Number(el.chunk.value) * 1024 * 1024; } // 256KiB の倍数

  el.btnStart.addEventListener('click', function(){
    if (!file || busy) return;
    busy = true; setButtons();
    status('セッションを作っています…');
    log('start: 区切り ' + el.chunk.value + 'MiB / Origin ' + (el.withOrigin.checked ? 'あり' : 'なし'));
    callApi({action:'start', name:file.name, size:file.size, type:file.type, withOrigin:el.withOrigin.checked})
      .then(function(r){
        if (!r.ok) { setCheck('session', false); throw new Error('start を断られた: ' + r.reason); }
        setCheck('session', true);
        session = r.session; total = file.size; offset = 0; autoCount = 0; hadCut = false; startedAt = Date.now();
        saveSession();
        log('session 取得 ' + tail(session));
        return uploadFrom(0);
      })
      .catch(fail);
  });

  el.btnResume.addEventListener('click', function(){
    if (busy) return;
    if (!session && saved && file && sameFile(saved, file)) { session = saved.session; total = saved.size; }
    if (!session) return;
    if (!startedAt) startedAt = Date.now(); // 読み込み直した後の再開では、ここから速度を測る
    busy = true; setButtons();
    queryAndContinue('手動');
  });

  el.btnAbort.addEventListener('click', function(){
    if (aborter) aborter.abort();
    log('中断ボタン');
  });

  function uploadFrom(pos){
    offset = pos;
    if (offset >= total) return Promise.resolve();
    var end = Math.min(offset + chunkBytes(), total);
    var blob = file.slice(offset, end);
    aborter = new AbortController();
    var began = Date.now();
    return fetch(session, {
      method:'PUT',
      headers:{'Content-Range':'bytes ' + offset + '-' + (end - 1) + '/' + total},
      body: blob,
      signal: aborter.signal
    }).then(function(res){
      setCheck('preflightPut', true);
      if (res.status === 308) {
        setCheck('got308', true);
        var range = res.headers.get('Range');
        setCheck('rangeReadable', !!range);
        var next = nextFromRange(range);
        log('308 ' + mb(end - offset) + ' ' + ((Date.now() - began) / 1000).toFixed(1) + 's Range=' + (range || '(読めない)'));
        // Range が読めないときは、送ったぶんが届いたとみなして進める（記録には × を残す）
        if (next === null) next = end;
        progress(next);
        return uploadFrom(next);
      }
      if (res.status === 200 || res.status === 201) {
        return res.json().then(function(meta){
          progress(total);
          setCheck('completed', true);
          if (hadCut) setCheck('resumedAfterCut', true);
          log('完了 ' + res.status + ' fileId=' + tail(meta.id) + ' 合計 ' + ((Date.now() - startedAt) / 1000).toFixed(1) + 's');
          clearSession();
          status('Drive に届きました。確認しています…', 'ok');
          return callApi({action:'finish', fileId:meta.id, size:total}).then(function(v){
            setCheck('verified', !!v.ok);
            log('finish: ' + JSON.stringify(v));
            status(v.ok ? '送信完了（Drive 側でサイズ・種類・置き場所を確認しました）' : '届きましたが、確認で食い違いがありました', v.ok ? 'ok' : 'ng');
            busy = false; setButtons();
          });
        });
      }
      if (res.status === 404 || res.status === 410) throw new Error('セッションが無効（' + res.status + '）');
      throw new Error('PUT が ' + res.status + ' を返した');
    }).catch(function(err){
      if (err && err.name === 'AbortError') { status('中断しました。「続きから」で再開できます'); busy = false; setButtons(); return; }
      // TypeError（Failed to fetch / Load failed）は、通信断か CORS。区別は付かないので両方を記録する
      if (err instanceof TypeError) {
        if (checks.preflightPut !== true) setCheck('preflightPut', false);
        hadCut = true;
        log('通信エラー（通信断または CORS）: ' + err.message);
        if (el.autoResume.checked && autoCount < MAX_AUTO_RESUME && checks.preflightPut === true) {
          autoCount++;
          status('通信が切れました。3秒後に再開します（' + autoCount + '回目）');
          return new Promise(function(r){ setTimeout(r, 3000); }).then(function(){ return queryAndContinue('自動'); });
        }
        status('通信が切れました。「続きから」で再開できます', 'ng'); busy = false; setButtons(); return;
      }
      throw err;
    });
  }

  // 再開位置は手元の記録ではなく、必ず Drive に問い合わせて決める
  function queryAndContinue(how){
    log('状態の問い合わせ（' + how + '）');
    aborter = new AbortController();
    return fetch(session, {method:'PUT', headers:{'Content-Range':'bytes */' + total}, signal:aborter.signal})
      .then(function(res){
        if (res.status === 308) {
          var range = res.headers.get('Range');
          setCheck('rangeReadable', !!range);
          var next = nextFromRange(range);
          if (next === null) next = 0;
          hadCut = true;
          log('問い合わせ 308 Range=' + (range || '(なし)') + ' → ' + next + ' から');
          progress(next);
          return uploadFrom(next);
        }
        if (res.status === 200 || res.status === 201) { log('問い合わせ: すでに完了していた'); progress(total); setCheck('completed', true); clearSession(); busy = false; setButtons(); return; }
        throw new Error('問い合わせが ' + res.status + ' を返した（期限切れなら 404）');
      })
      .catch(function(err){
        if (err instanceof TypeError && autoCount < MAX_AUTO_RESUME && el.autoResume.checked) {
          autoCount++;
          log('問い合わせも通信エラー。5秒後にもう一度（' + autoCount + '回目）');
          return new Promise(function(r){ setTimeout(r, 5000); }).then(function(){ return queryAndContinue('自動'); });
        }
        fail(err);
      });
  }

  function nextFromRange(range){
    var m = /bytes=0-(\d+)/.exec(range || '');
    return m ? Number(m[1]) + 1 : null;
  }

  function progress(pos){
    var pct = total ? Math.floor(pos / total * 100) : 0;
    el.barFill.style.width = pct + '%';
    var sec = (Date.now() - startedAt) / 1000;
    el.stats.textContent = pct + '%　' + mb(pos) + ' / ' + mb(total) + (sec > 0 ? '　' + (pos / 1024 / 1024 / sec).toFixed(2) + ' MB/s' : '');
    if (pos < total) status('送信中 ' + pct + '%');
    if (session) saveSession(pos);
  }

  function fail(err){
    log('失敗: ' + (err && err.message ? err.message : err));
    status('失敗しました：' + (err && err.message ? err.message : err), 'ng');
    busy = false; setButtons();
  }

  function setButtons(){
    el.btnStart.disabled = busy || !file || !token;
    el.btnAbort.disabled = !busy;
    el.btnResume.disabled = busy || !(session || (saved && file && sameFile(saved, file)));
    el.picker.disabled = busy;
  }

  function saveSession(pos){
    try { sessionStorage.setItem(SS_SESSION, JSON.stringify({session:session, name:file.name, size:file.size,
      lastModified:file.lastModified, pos:pos || 0})); } catch(e) {}
  }
  function clearSession(){ try { sessionStorage.removeItem(SS_SESSION); } catch(e) {} saved = null; el.resumeHint.style.display = 'none'; }

  // ---------------------------------------------------------- 結果をコピー（session URI・トークンは含めない）
  el.btnCopy.addEventListener('click', function(){
    var out = ['動画送信テスト 結果', new Date().toLocaleString('ja-JP'), navigator.userAgent, ''];
    Object.keys(CHECK_LABEL).forEach(function(k){
      out.push(CHECK_LABEL[k] + ': ' + (checks[k] === null ? '—' : (checks[k] ? '○' : '×')));
    });
    out.push('区切り: ' + el.chunk.value + 'MiB / Origin: ' + (el.withOrigin.checked ? 'あり' : 'なし'));
    out.push('', lines.join('\n'));
    var text = out.join('\n');
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
      .then(function(){ status('結果をコピーしました', 'ok'); })
      .catch(function(){ status('コピーできませんでした。記録欄を長押しして選んでください', 'ng'); });
  });
  el.btnClear.addEventListener('click', function(){
    lines = []; el.log.textContent = '';
    Object.keys(checks).forEach(function(k){ checks[k] = null; }); renderChecks();
  });

  renderChecks();
  log('読み込み ' + navigator.userAgent);
})();
</script>
</body>
</html>
